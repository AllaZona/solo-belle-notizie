<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Belle Notizie</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #0f172a;
            --text-muted: #475569;
            --card-bg: rgba(255, 255, 255, 0.95);
            --accent: #0ea5e9;
            --accent-hover: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Inter', sans-serif; 
            color: var(--text-main); 
            line-height: 1.5;
            padding: 0 20px 60px;
            margin: 0;
            min-height: 100vh;
        }

        /* Sfondo animato */
        .bg-animation {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background: linear-gradient(-45deg, #a1c4fd, #c2e9fb, #fbc2eb, #e6dee9);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Bolle fluttuanti */
        .bubbles {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        .bubbles li {
            position: absolute;
            list-style: none;
            display: block;
            width: 40px;
            height: 40px;
            background-color: rgba(255, 255, 255, 0.3);
            bottom: -160px;
            animation: square 25s infinite linear;
            border-radius: 50%;
        }

        .bubbles li:nth-child(1) { left: 10%; width: 80px; height: 80px; animation-delay: 0s; }
        .bubbles li:nth-child(2) { left: 20%; width: 30px; height: 30px; animation-delay: 2s; animation-duration: 17s; }
        .bubbles li:nth-child(3) { left: 25%; animation-delay: 4s; }
        .bubbles li:nth-child(4) { left: 40%; width: 60px; height: 60px; animation-delay: 0s; animation-duration: 18s; }
        .bubbles li:nth-child(5) { left: 70%; width: 20px; height: 20px; animation-delay: 0s; }
        .bubbles li:nth-child(6) { left: 80%; width: 120px; height: 120px; animation-delay: 3s; background-color: rgba(255, 255, 255, 0.2); }
        .bubbles li:nth-child(7) { left: 32%; width: 160px; height: 160px; animation-delay: 7s; }
        .bubbles li:nth-child(8) { left: 55%; width: 20px; height: 20px; animation-delay: 15s; animation-duration: 40s; }
        .bubbles li:nth-child(9) { left: 25%; width: 10px; height: 10px; animation-delay: 2s; animation-duration: 40s; background-color: rgba(255, 255, 255, 0.3); }
        .bubbles li:nth-child(10) { left: 90%; width: 160px; height: 160px; animation-delay: 11s; }

        @keyframes square {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-1000px) scale(1.5); opacity: 0; }
        }

        header { text-align: center; padding: 60px 20px 40px; max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
        h1 { font-weight: 800; font-size: 2.8rem; color: var(--text-main); margin-bottom: 8px; letter-spacing: -0.025em; }
        h1 span { color: var(--accent); }
        .subtitle { color: var(--text-muted); font-size: 1.15rem; font-weight: 600; margin-bottom: 12px; }
        .quote { color: var(--text-muted); font-size: 1rem; font-style: italic; background: rgba(255,255,255,0.6); display: inline-block; padding: 8px 16px; border-radius: 20px;}

        #contenitore-notizie {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
            position: relative;
            z-index: 1;
        }

        .notizia { 
            background: var(--card-bg); 
            border-radius: 16px; 
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -4px rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
            border: 1px solid rgba(255,255,255,0.4);
            overflow: hidden;
            backdrop-filter: blur(10px);
        }

        .notizia:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        }

        .immagine-notizia {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: #e2e8f0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .notizia-content {
            padding: 24px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            flex-grow: 1;
        }

        .fonte { 
            display: inline-block; 
            background-color: #e0f2fe; 
            color: #0369a1; 
            font-size: 0.75rem; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 6px 12px; 
            border-radius: 20px; 
            margin-bottom: 16px; 
            font-weight: 700;
            align-self: flex-start;
        }

        .titolo-link { 
            color: var(--text-main); 
            text-decoration: none; 
            font-size: 1.15rem; 
            font-weight: 700;
            display: block;
            margin-bottom: 24px;
        }

        .titolo-link:hover { color: var(--accent); }

        .leggi-tutto {
            font-size: 0.875rem;
            color: var(--accent);
            font-weight: 700;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .leggi-tutto:hover { color: var(--accent-hover); }
        .loader { text-align: center; color: var(--text-main); font-weight: bold; grid-column: 1 / -1; padding: 40px; }
    </style>
</head>
<body>
    <div class="bg-animation">
        <ul class="bubbles">
            <li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li><li></li>
        </ul>
    </div>

    <header>
        <h1>Solo <span>Belle</span> Notizie</h1>
        <p class="subtitle">L'aggregatore automatico di positività degli ultimi 7 giorni.</p>
        <p class="quote" id="citazione-giornaliera">Caricamento in corso...</p>
    </header>
    
    <div id="contenitore-notizie">
        <div class="loader">Ricerca delle notizie in corso...</div>
    </div>

    <script>
        fetch('notizie.json')
            .then(response => response.json())
            .then(dati => {
                
                if (dati.citazione) {
                    document.getElementById('citazione-giornaliera').innerText = dati.citazione;
                }

                const arrayNotizie = Array.isArray(dati) ? dati : dati.notizie;
                const contenitore = document.getElementById('contenitore-notizie');
                contenitore.innerHTML = '';
                
                if(!arrayNotizie || arrayNotizie.length === 0) {
                    contenitore.innerHTML = '<div class="loader">Nessuna notizia positiva trovata negli ultimi 7 giorni. Riprova più tardi.</div>';
                    return;
                }

                arrayNotizie.forEach(notizia => {
                    const tagImmagine = notizia.immagine 
                        ? `<a href="${notizia.link}" target="_blank" rel="noopener noreferrer"><img src="${notizia.immagine}" class="immagine-notizia" alt="Immagine articolo" loading="lazy"></a>`
                        : ``;

                    contenitore.innerHTML += `
                        <div class="notizia">
                            ${tagImmagine}
                            <div class="notizia-content">
                                <div>
                                    <span class="fonte">${notizia.fonte}</span>
                                    <a class="titolo-link" href="${notizia.link}" target="_blank" rel="noopener noreferrer">${notizia.titolo}</a>
                                </div>
                                <a href="${notizia.link}" target="_blank" rel="noopener noreferrer" class="leggi-tutto">Leggi l'articolo &rarr;</a>
                            </div>
                        </div>
                    `;
                });
            })
            .catch(error => {
                document.getElementById('contenitore-notizie').innerHTML = '<div class="loader">Impossibile caricare le notizie.</div>';
                document.getElementById('citazione-giornaliera').innerText = '';
            });
    </script>
</body>
</html>
