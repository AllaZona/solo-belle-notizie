<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Belle Notizie</title>
    <!-- Importazione del font moderno 'Inter' da Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f8fafc;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --card-bg: #ffffff;
            --accent: #10b981; /* Verde brillante e moderno */
            --accent-hover: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.5;
            padding: 0 20px 60px;
        }

        header {
            text-align: center;
            padding: 60px 20px 40px;
            max-width: 800px;
            margin: 0 auto;
        }

        h1 { 
            font-weight: 800;
            font-size: 2.5rem;
            color: var(--text-main);
            margin-bottom: 12px;
            letter-spacing: -0.025em;
        }

        h1 span {
            color: var(--accent);
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        /* Layout a griglia responsive */
        #contenitore-notizie {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 24px;
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Design delle singole card */
        .notizia { 
            background: var(--card-bg); 
            padding: 24px; 
            border-radius: 16px; 
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.025);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            border: 1px solid #e2e8f0;
        }

        .notizia:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.08), 0 4px 6px -4px rgba(0, 0, 0, 0.04);
        }

        .fonte { 
            display: inline-block; 
            background-color: #f1f5f9; 
            color: var(--text-muted); 
            font-size: 0.75rem; 
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 6px 12px; 
            border-radius: 20px; 
            margin-bottom: 16px; 
            font-weight: 600;
            align-self: flex-start;
        }

        .titolo-link { 
            color: var(--text-main); 
            text-decoration: none; 
            font-size: 1.15rem; 
            font-weight: 600;
            display: block;
            margin-bottom: 24px;
        }

        .titolo-link:hover { 
            color: var(--accent); 
        }

        .leggi-tutto {
            font-size: 0.875rem;
            color: var(--accent);
            font-weight: 600;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .leggi-tutto:hover {
            color: var(--accent-hover);
        }
        
        .loader {
            text-align: center;
            color: var(--text-muted);
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>Solo <span>Belle</span> Notizie</h1>
        <p class="subtitle">Un aggregatore automatico di positività dal mondo.</p>
    </header>
    
    <div id="contenitore-notizie">
        <div class="loader">Ricerca delle notizie in corso...</div>
    </div>

    <script>
        fetch('notizie.json')
            .then(response => response.json())
            .then(dati => {
                const contenitore = document.getElementById('contenitore-notizie');
                contenitore.innerHTML = '';
                
                if(!dati || dati.length === 0) {
                    contenitore.innerHTML = '<div class="loader">Nessuna notizia disponibile al momento. Riprova più tardi.</div>';
                    return;
                }

                dati.forEach(notizia => {
                    contenitore.innerHTML += `
                        <div class="notizia">
                            <div>
                                <span class="fonte">${notizia.fonte}</span>
                                <a class="titolo-link" href="${notizia.link}" target="_blank" rel="noopener noreferrer">${notizia.titolo}</a>
                            </div>
                            <a href="${notizia.link}" target="_blank" rel="noopener noreferrer" class="leggi-tutto">Leggi l'articolo &rarr;</a>
                        </div>
                    `;
                });
            })
            .catch(error => {
                document.getElementById('contenitore-notizie').innerHTML = '<div class="loader">Impossibile caricare le notizie.</div>';
            });
    </script>
</body>
</html>
