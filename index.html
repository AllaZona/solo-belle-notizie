<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solo Belle Notizie - La tua oasi felice</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --text-main: #4a4a4a;
            --card-bg: rgba(255, 255, 255, 0.92);
            --accent: #ff8fab;
            --accent-hover: #ff5c8a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body { 
            font-family: 'Nunito', sans-serif; 
            color: var(--text-main); 
            line-height: 1.6;
            padding: 0 20px 80px;
            margin: 0;
            min-height: 100vh;
            background: linear-gradient(-45deg, #fbc2eb, #a6c1ee, #fcd3d1, #e3fdf5);
            background-size: 400% 400%;
            animation: gradientBG 20s ease infinite;
            overflow-x: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Unicorni che corrono sullo sfondo */
        .background-unicorns {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
            overflow: hidden;
        }
        .running-unicorn {
            position: absolute;
            font-size: 2.5rem;
            animation: runAcross 18s linear infinite;
            opacity: 0.5;
        }
        .running-unicorn:nth-child(1) { top: 15%; animation-duration: 22s; animation-delay: 0s; }
        .running-unicorn:nth-child(2) { top: 45%; animation-duration: 15s; animation-delay: 3s; font-size: 2rem; }
        .running-unicorn:nth-child(3) { top: 75%; animation-duration: 20s; animation-delay: 7s; font-size: 3rem; }

        @keyframes runAcross {
            0% { transform: translateX(-100px) scaleX(1); }
            49% { transform: translateX(calc(100vw + 50px)) scaleX(1); }
            50% { transform: translateX(calc(100vw + 50px)) scaleX(-1); }
            100% { transform: translateX(-100px) scaleX(-1); }
        }

        header { text-align: center; padding: 50px 20px 20px; max-width: 800px; margin: 0 auto; position: relative; z-index: 1; }
        h1 { font-weight: 800; font-size: 3rem; color: #333; margin-bottom: 8px; }
        h1 span { color: var(--accent); }
        .quote { color: #fff; font-size: 1.2rem; font-weight: 800; background: rgba(255, 143, 171, 0.85); display: inline-block; padding: 12px 24px; border-radius: 30px; box-shadow: 0 4px 15px rgba(255, 143, 171, 0.4); margin-bottom: 20px;}
        
        .zen-zone { background: rgba(255, 255, 255, 0.7); border-radius: 20px; padding: 20px; max-width: 600px; margin: 0 auto 30px auto; text-align: center; backdrop-filter: blur(5px); }
        .breathe-text { font-size: 1.1rem; color: #666; font-weight: 600; margin-top: 10px; }
        .curiosity-box { margin-top: 15px; font-size: 0.95rem; color: #0284c7; background: #e0f2fe; padding: 12px; border-radius: 12px; }

        .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 30px; position: relative; z-index: 1; max-width: 800px; margin-left: auto; margin-right: auto; }
        .tab-btn { background: rgba(255, 255, 255, 0.6); border: 2px solid transparent; padding: 8px 18px; border-radius: 20px; cursor: pointer; font-family: 'Nunito', sans-serif; font-weight: 700; color: var(--text-main); transition: all 0.3s ease; backdrop-filter: blur(5px); font-size: 0.95rem; }
        .tab-btn:hover { background: rgba(255, 255, 255, 0.9); }
        .tab-btn.active { background: var(--accent); color: white; box-shadow: 0 4px 10px rgba(255, 143, 171, 0.4); }

        #contenitore-notizie { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; max-width: 1200px; margin: 0 auto; position: relative; z-index: 1; }

        .notizia { 
            background: var(--card-bg); border-radius: 24px; 
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.05); transition: transform 0.3s ease, box-shadow 0.3s ease;
            display: flex; flex-direction: column; border: 2px solid transparent; backdrop-filter: blur(10px);
            position: relative; overflow: visible; /* Necessario per fare uscire il segnalibro */
        }
        
        .notizia:hover { transform: translateY(-8px); border: 2px solid var(--accent); box-shadow: 0 15px 30px rgba(255, 143, 171, 0.2); z-index: 2;}

        /* Segnalibro che scende dall'alto */
        .categoria-segnalibro {
            position: absolute;
            top: -2px;
            right: 25px;
            color: white;
            font-size: 0.75rem;
            font-weight: 800;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 8px 12px 10px 12px;
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.15);
            z-index: 5;
        }

        .immagine-notizia { width: 100%; height: 190px; object-fit: cover; border-top-left-radius: 22px; border-top-right-radius: 22px;}
        .notizia-content { padding: 24px; display: flex; flex-direction: column; justify-content: space-between; flex-grow: 1; }
        
        .meta-info { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; flex-wrap: wrap; gap: 8px; }

        .fonte { background-color: #fef08a; color: #854d0e; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 5px 12px; border-radius: 20px; font-weight: 800; }
        .data-notizia { font-size: 0.85rem; color: #9ca3af; font-weight: 600; }

        .titolo-link { color: var(--text-main); text-decoration: none; font-size: 1.2rem; font-weight: 800; display: block; margin-bottom: 24px; }
        .titolo-link:hover { color: var(--accent-hover); }

        .leggi-tutto { font-size: 0.9rem; color: var(--accent); font-weight: 800; text-decoration: none; display: flex; align-items: center; gap: 4px; }
        .leggi-tutto:hover { color: var(--accent-hover); }
        .loader { text-align: center; color: var(--text-main); font-weight: bold; grid-column: 1 / -1; padding: 40px; font-size: 1.2rem;}
    </style>
</head>
<body>
    <!-- Sfondo con unicorni che corrono -->
    <div class="background-unicorns">
        <div class="running-unicorn">🦄</div>
        <div class="running-unicorn">🦄</div>
        <div class="running-unicorn">🦄</div>
    </div>

    <header>
        <h1>Solo <span>Belle</span> Notizie</h1>
        <p class="quote" id="citazione-giornaliera">Caricamento in corso... ✨</p>
    </header>

    <div class="zen-zone">
        <p class="breathe-text">Benvenuto nel tuo spazio sicuro e rilassante. Prenditi un momento per te.</p>
        <div class="curiosity-box" id="curiosita-giornaliera">💡 Preparando una curiosità felice...</div>
    </div>
    
    <div class="tabs" id="tabs-container">
    </div>

    <div id="contenitore-notizie">
        <div class="loader">Cerco le notizie più belle per te... 🌻</div>
    </div>

    <script>
        let tutteLeNotizie = [];

        // Colori dedicati per ogni categoria di segnalibro
        function getCategoryColor(cat) {
            switch(cat) {
                case 'Scienza & Tech': return '#3b82f6'; // Blu
                case 'Animali': return '#10b981';      // Verde
                case 'Salute': return '#06b6d4';       // Turchese
                case 'Società': return '#f59e0b';      // Ambra/Arancione
                default: return '#8b5cf6';             // Viola (Mondo)
            }
        }

        fetch('notizie.json')
            .then(response => response.json())
            .then(dati => {
                if (dati.citazione) document.getElementById('citazione-giornaliera').innerText = dati.citazione;
                if (dati.curiosita) document.getElementById('curiosita-giornaliera').innerHTML = "💡 <b>Lo sapevi?</b> " + dati.curiosita;

                tutteLeNotizie = Array.isArray(dati) ? dati : dati.notizie;
                const contenitore = document.getElementById('contenitore-notizie');
                const tabsContainer = document.getElementById('tabs-container');
                
                if(!tutteLeNotizie || tutteLeNotizie.length === 0) {
                    contenitore.innerHTML = '<div class="loader">Nessuna nuova notizia positiva trovata al momento. Goditi questa giornata meravigliosa! 🌈</div>';
                    return;
                }

                const categorie = new Set(["Tutte"]);
                tutteLeNotizie.forEach(n => {
                    if(n.categoria) categorie.add(n.categoria);
                });

                categorie.forEach(cat => {
                    const btn = document.createElement('button');
                    btn.className = 'tab-btn' + (cat === 'Tutte' ? ' active' : '');
                    btn.innerText = cat;
                    btn.onclick = () => filtraNotizie(cat, btn);
                    tabsContainer.appendChild(btn);
                });

                mostraNotizie(tutteLeNotizie);
            })
            .catch(error => {
                document.getElementById('contenitore-notizie').innerHTML = '<div class="loader">Impossibile caricare le notizie in questo momento. 🌸</div>';
                document.getElementById('citazione-giornaliera').innerText = 'Respira e rilassati.';
            });

        function filtraNotizie(categoria, btn) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');

            if(categoria === 'Tutte') {
                mostraNotizie(tutteLeNotizie);
            } else {
                const filtrate = tutteLeNotizie.filter(n => n.categoria === categoria);
                mostraNotizie(filtrate);
            }
        }

        function mostraNotizie(notizie) {
            const contenitore = document.getElementById('contenitore-notizie');
            contenitore.innerHTML = '';

            if(notizie.length === 0) {
                contenitore.innerHTML = '<div class="loader">Nessuna notizia in questa categoria. 🌻</div>';
                return;
            }

            notizie.forEach(notizia => {
                const tagImmagine = notizia.immagine 
                    ? `<a href="${notizia.link}" target="_blank" rel="noopener noreferrer"><img src="${notizia.immagine}" class="immagine-notizia" alt="Immagine articolo" loading="lazy"></a>`
                    : ``;
                
                const dataRender = notizia.data ? `<span class="data-notizia">${notizia.data}</span>` : ``;
                
                // Generazione del segnalibro colorato in base alla categoria
                let catSegnalibro = '';
                if (notizia.categoria) {
                    const bgColor = getCategoryColor(notizia.categoria);
                    catSegnalibro = `<div class="categoria-segnalibro" style="background-color: ${bgColor};">${notizia.categoria}</div>`;
                }

                contenitore.innerHTML += `
                    <div class="notizia">
                        ${catSegnalibro}
                        ${tagImmagine}
                        <div class="notizia-content">
                            <div>
                                <div class="meta-info">
                                    <span class="fonte">${notizia.fonte}</span>
                                    ${dataRender}
                                </div>
                                <a class="titolo-link" href="${notizia.link}" target="_blank" rel="noopener noreferrer">${notizia.titolo}</a>
                            </div>
                            <a href="${notizia.link}" target="_blank" rel="noopener noreferrer" class="leggi-tutto">Leggi l'articolo &rarr;</a>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
